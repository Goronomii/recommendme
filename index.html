<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750, initial-scale=1.0"> 
    <title>RecomMe - Entertainment Recommendation</title>
    <link rel="icon" type="image/x-icon" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay"></div>
    <div class="container">
      <div class="container-content">
        
        <h1>Recommend Me</h1>
        <!-- Select Type of Entertainment -->
        <br />
        <select id="entertainment-type" onchange="updateSelections()">
          <option value="" disabled selected>
            Select Type of Entertainment
          </option>
          <option value="anime">anime</option>
          <option value="movie">movie</option>
          <option value="manga">manga</option>
        </select>
        <br />

        <div class="dropdown-container">
          <div id="genre-section" class="dropdown hidden">
            <div id="genre-dropdown" class="dropdown-toggle">Select Genres</div>
            <div class="dropdown-content" id="genres-container"></div>
          </div>

          <div id="exclude-genre-section" class="dropdown hidden">
            <div id="exclude-genre-dropdown" class="dropdown-toggle">
              Exclude Genres
            </div>
            <div class="dropdown-content" id="exclude-genres-container"></div>
          </div>
        </div>

        <!-- Year Range -->
        <div class="form-group hidden" id="year-range-section">
          <select id="year-range">
            <option value="">Select Year Range (Optional)</option>
            <option value="2000-2005">2000 - 2005</option>
            <option value="2006-2010">2006 - 2010</option>
            <option value="2011-2015">2011 - 2015</option>
            <option value="2016-2020">2016 - 2020</option>
            <option value="2021-2025">2021 - 2024</option>
          </select>
        </div>

        <!-- Number of Recommendations -->
        <div class="form-group hidden" id="recommendation-count-section">
          <label for="recommendation-count">How many recommendations? </label>
          <input
            class="form-control"
            name="quantity"
            id="recommendation-count"
            type="number"
            min="4"
            max="8"
            value="4"
          />
          <span style="opacity: 0.3;">max value is 8</span>
        </div>

        <!-- Recommend Me button -->
        <div class="button-container" >
          <button onclick="generateRecommendation()" style="display: none">
            Recommend Me!
          </button>
        </div>

        <div class="credit">
          <p>NOTE: Recommendation count may not be accurate. Recommended is 4. and Year is bugging sometimes</p>
          <p>API I used: <a href="https://www.themoviedb.org/" style="color:rgb(82, 171, 223);">TheMovieDB</a> and <a href="https://jikan.moe/" style="color:rgb(82, 171, 223);">jikan.moe</a></p>
          <p>Made by: <a href="https://github.com/Arnav-Pratap" style="color:rgb(82, 171, 223);">J.D</a></p>
          <p>Version: 1.0.0</p>
          <p>Contact: <a href="mailto:jamesdionisio288@gmail.com" style="color:rgb(82, 171, 223);">jamesdionisio288@gmail.com</a></p>
        </div>
      </div>
    </div>
    </script>
    <script src="script.js"></script>
  </body>
</html>
